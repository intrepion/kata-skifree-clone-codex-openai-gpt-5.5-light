<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slope Free</title>
    <link rel="stylesheet" href="./styles.css">
  <style>[data-kata-arcade-nav] a:focus-visible { outline: 3px solid #ffdf70 !important; outline-offset: 3px; }</style>
</head>
  <body>
    <div role="navigation" aria-label="Arcade navigation" data-kata-arcade-nav style="all:initial;display:block;position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483647;font:600 13px/1.3 system-ui,sans-serif; pointer-events: none;">
      <a href="https://intrepion.github.io/" style="display:inline-block;margin:8px;padding:8px 12px;border:2px solid #fff;border-radius:6px;background:#17262a;color:#fff;text-decoration:underline;text-underline-offset:3px;box-shadow:0 1px 4px #0008; pointer-events: auto;">← Kata Arcade</a>
    </div>

    <canvas id="game" aria-label="Slope Free game canvas"></canvas>

    <div class="hud" aria-live="polite">
      <div class="brand">Slope Free</div>
      <div>Distance <strong id="distance">0m</strong></div>
      <div>Score <strong id="score">0</strong></div>
      <div>Best <strong id="best">0 / 0m</strong></div>
      <div>Status <strong id="status">Ready</strong></div>
      <div class="hud-actions">
        <button id="new-slope-button" type="button" aria-label="New slope">New Slope</button>
        <button id="reset-bests-button" type="button" aria-label="Reset bests">Reset Bests</button>
      </div>
    </div>

    <div class="menu" id="menu">
      <h1>Slope Free</h1>
      <p>Arrow keys steer. Z tricks while airborne. Space starts or restarts. Ski downhill, dodge the clutter, and keep the run clean.</p>
      <button id="start-button" type="button">Start Run</button>
    </div>

    <div class="touch-controls" aria-label="Touch controls">
      <button type="button" data-touch="left" aria-label="Steer left">◀</button>
      <button type="button" data-touch="trick" aria-label="Trick">Z</button>
      <button type="button" data-touch="start" aria-label="Start or restart">▶</button>
      <button type="button" data-touch="right" aria-label="Steer right">▶</button>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
